<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin Dashboard</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #2a2e38; --text: #e6e8ec;
    --text-muted: #8b90a0; --accent: #6d5ef8; --danger: #e5484d; --radius: 8px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px; }
  a { color: var(--accent); }
  button { font: inherit; cursor: pointer; border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--panel); color: var(--text); padding: 8px 14px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button.danger { border-color: var(--danger); color: var(--danger); background: transparent; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  input, select { font: inherit; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: var(--radius); padding: 8px 10px; width: 100%; }
  label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; margin-top: 12px; }
  .center-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 28px;
    width: 100%; max-width: 380px; }
  .card h1 { font-size: 18px; margin: 0 0 4px; }
  .card p.hint { color: var(--text-muted); margin: 0 0 8px; font-size: 13px; }
  .error { color: var(--danger); font-size: 13px; margin-top: 10px; }
  .success { color: #4caf6f; font-size: 13px; margin-top: 10px; }
  .shell { display: flex; min-height: 100vh; }
  .sidebar { width: 220px; flex-shrink: 0; border-right: 1px solid var(--border); padding: 16px 12px;
    display: flex; flex-direction: column; }
  .sidebar h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted);
    margin: 16px 8px 6px; }
  .sidebar .nav-item { display: block; width: 100%; text-align: left; padding: 8px; border-radius: 6px;
    border: none; background: transparent; color: var(--text); margin-bottom: 2px; }
  .sidebar .nav-item:hover { background: var(--panel); }
  .sidebar .nav-item.active { background: var(--accent); color: white; }
  .main { flex: 1; padding: 24px 32px; overflow: auto; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .topbar .who { color: var(--text-muted); font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap;
    max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
  th { color: var(--text-muted); font-weight: 600; }
  .row-actions button { padding: 4px 8px; font-size: 12px; margin-right: 6px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px;
    margin-bottom: 20px; }
  .field-badge { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px;
    background: var(--bg); border: 1px solid var(--border); color: var(--text-muted); margin-left: 6px; }
  code { background: var(--bg); padding: 2px 6px; border-radius: 4px; }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex;
    align-items: center; justify-content: center; padding: 20px; z-index: 10; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 24px;
    width: 100%; max-width: 480px; max-height: 85vh; overflow: auto; }
  .modal h3 { margin-top: 0; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .empty { color: var(--text-muted); padding: 20px 0; }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  "use strict";

  var state = { loading: true, user: null, needsSetup: false, models: [], activeModel: null, view: "docs" };

  function escapeHtml(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }

  function api(path, opts) {
    opts = opts || {};
    var headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
    return fetch("/__dashboard" + path, {
      method: opts.method || "GET",
      credentials: "include",
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (!res.ok) throw new Error(data.error || ("Request failed (" + res.status + ")"));
        return data;
      });
    });
  }

  function render() {
    var root = document.getElementById("app");
    var path = window.location.pathname;
    var inviteMatch = path.match(/\/__dashboard\/accept-invite\/([^/]+)/);

    if (state.loading) {
      root.innerHTML = '<div class="center-screen"><p class="hint">Loading…</p></div>';
      return;
    }
    if (inviteMatch && !state.user) {
      renderAcceptInvite(root, inviteMatch[1]);
      return;
    }
    if (!state.user) {
      renderAuth(root);
      return;
    }
    renderShell(root);
  }

  // ---- Auth screens ----

  function renderAuth(root) {
    var isSetup = state.needsSetup;
    root.innerHTML =
      '<div class="center-screen"><div class="card">' +
      "<h1>" + (isSetup ? "Set up this dashboard" : "Sign in") + "</h1>" +
      '<p class="hint">' +
      (isSetup
        ? "No owner exists yet for this dashboard. Create the first account to become its owner."
        : "Sign in to manage this app's data.") +
      "</p>" +
      '<form id="auth-form">' +
      '<label>Email</label><input type="email" name="email" required autofocus />' +
      '<label>Password</label><input type="password" name="password" required minlength="8" />' +
      '<div style="margin-top:18px"><button class="primary" type="submit" style="width:100%">' +
      (isSetup ? "Create owner account" : "Sign in") +
      "</button></div>" +
      '<div class="error" id="auth-error"></div>' +
      "</form></div></div>";

    document.getElementById("auth-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var form = new FormData(e.target);
      var body = { email: form.get("email"), password: form.get("password") };
      api(isSetup ? "/api/setup" : "/api/login", { method: "POST", body: body })
        .then(function (data) {
          state.user = data.user;
          return loadSchema();
        })
        .then(render)
        .catch(function (err) {
          document.getElementById("auth-error").textContent = err.message;
        });
    });
  }

  function renderAcceptInvite(root, token) {
    root.innerHTML =
      '<div class="center-screen"><div class="card">' +
      "<h1>Accept invite</h1>" +
      '<p class="hint" id="invite-email">Checking invite…</p>' +
      '<form id="invite-form" style="display:none">' +
      '<label>Set a password</label><input type="password" name="password" required minlength="8" />' +
      '<div style="margin-top:18px"><button class="primary" type="submit" style="width:100%">Activate account</button></div>' +
      '<div class="error" id="invite-error"></div>' +
      "</form></div></div>";

    api("/api/invite/" + token)
      .then(function (data) {
        document.getElementById("invite-email").textContent = "Setting up dashboard access for " + data.email;
        document.getElementById("invite-form").style.display = "block";
      })
      .catch(function (err) {
        document.getElementById("invite-email").textContent = err.message;
      });

    document.getElementById("invite-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var form = new FormData(e.target);
      api("/api/accept-invite", { method: "POST", body: { token: token, password: form.get("password") } })
        .then(function (data) {
          state.user = data.user;
          window.history.replaceState(null, "", "/__dashboard");
          return loadSchema();
        })
        .then(render)
        .catch(function (err) {
          document.getElementById("invite-error").textContent = err.message;
        });
    });
  }

  // ---- Main shell ----

  function renderShell(root) {
    var navItems = state.models
      .map(function (m) {
        return (
          '<button class="nav-item ' + (state.activeModel === m.name && state.view !== "users" ? "active" : "") + '" ' +
          'data-model="' + escapeHtml(m.name) + '">' + escapeHtml(m.name) + "</button>"
        );
      })
      .join("");

    root.innerHTML =
      '<div class="shell">' +
      '<div class="sidebar">' +
      '<h2>Entities</h2>' + navItems +
      (state.user.role === "owner" ? '<h2>Admin</h2><button class="nav-item ' + (state.view === "users" ? "active" : "") + '" id="nav-users">Users</button>' : "") +
      "</div>" +
      '<div class="main">' +
      '<div class="topbar"><div></div><div class="who">' + escapeHtml(state.user.email) + " (" + state.user.role + ") &nbsp;·&nbsp; <a href=\"#\" id=\"logout-link\">Sign out</a></div></div>" +
      '<div id="main-content"></div>' +
      "</div></div>";

    document.getElementById("logout-link").addEventListener("click", function (e) {
      e.preventDefault();
      api("/api/logout", { method: "POST" }).then(function () {
        state.user = null;
        render();
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll(".nav-item[data-model]"), function (btn) {
      btn.addEventListener("click", function () {
        state.activeModel = btn.getAttribute("data-model");
        state.view = "data";
        render();
      });
    });

    var usersBtn = document.getElementById("nav-users");
    if (usersBtn) {
      usersBtn.addEventListener("click", function () {
        state.view = "users";
        render();
      });
    }

    var content = document.getElementById("main-content");
    if (state.view === "users") {
      renderUsers(content);
    } else if (state.activeModel) {
      var model = state.models.filter(function (m) { return m.name === state.activeModel; })[0];
      if (model) renderModel(content, model);
    } else if (state.models.length === 0) {
      content.innerHTML = '<div class="empty">No entities found — the app’s Prisma schema may not be readable yet.</div>';
    } else {
      state.activeModel = state.models[0].name;
      state.view = "data";
      render();
    }
  }

  // ---- Per-model docs + data ----

  function renderModel(container, model) {
    var editableFields = model.fields.filter(function (f) { return !f.isRelation && !f.isList; });
    var fieldRows = model.fields
      .map(function (f) {
        var badges = [];
        if (f.isId) badges.push("id");
        if (f.isOptional) badges.push("optional");
        if (f.isList) badges.push("list");
        if (f.isRelation) badges.push("relation");
        return (
          "<tr><td><code>" + escapeHtml(f.name) + "</code></td><td>" + escapeHtml(f.type) +
          (f.isList ? "[]" : "") + "</td><td>" +
          badges.map(function (b) { return '<span class="field-badge">' + b + "</span>"; }).join("") +
          "</td></tr>"
        );
      })
      .join("");

    container.innerHTML =
      '<div class="panel">' +
      "<h3 style=\"margin-top:0\">" + escapeHtml(model.name) + "</h3>" +
      "<p class=\"hint\" style=\"color:var(--text-muted)\">REST endpoint: <code>" + escapeHtml(model.apiPath) +
      "</code> — GET (list), GET /:id, POST, PUT /:id, DELETE /:id</p>" +
      "<table><thead><tr><th>Field</th><th>Type</th><th>Notes</th></tr></thead><tbody>" + fieldRows + "</tbody></table>" +
      "</div>" +
      '<div class="panel">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">' +
      "<h3 style=\"margin:0\">Data</h3>" +
      '<button class="primary" id="add-record">Add ' + escapeHtml(model.name) + "</button>" +
      "</div>" +
      '<div id="data-table"></div>' +
      "</div>";

    document.getElementById("add-record").addEventListener("click", function () {
      openRecordForm(model, editableFields, null);
    });

    loadData(model, editableFields);
  }

  function loadData(model, editableFields) {
    var box = document.getElementById("data-table");
    box.innerHTML = '<p class="hint">Loading…</p>';
    fetch(model.apiPath, { credentials: "include" })
      .then(function (res) { return res.json(); })
      .then(function (items) {
        if (!Array.isArray(items) || items.length === 0) {
          box.innerHTML = '<div class="empty">No records yet.</div>';
          return;
        }
        var columns = editableFields.map(function (f) { return f.name; });
        var head = columns.map(function (c) { return "<th>" + escapeHtml(c) + "</th>"; }).join("") + "<th></th>";
        var rows = items
          .map(function (item) {
            var cells = columns
              .map(function (c) { return "<td>" + escapeHtml(item[c]) + "</td>"; })
              .join("");
            return (
              "<tr>" + cells +
              '<td class="row-actions">' +
              '<button data-edit="' + escapeHtml(item.id) + '">Edit</button>' +
              '<button class="danger" data-delete="' + escapeHtml(item.id) + '">Delete</button>' +
              "</td></tr>"
            );
          })
          .join("");
        box.innerHTML = "<table><thead><tr>" + head + "</tr></thead><tbody>" + rows + "</tbody></table>";

        Array.prototype.forEach.call(box.querySelectorAll("[data-edit]"), function (btn) {
          btn.addEventListener("click", function () {
            var item = items.filter(function (i) { return String(i.id) === btn.getAttribute("data-edit"); })[0];
            openRecordForm(model, editableFields, item);
          });
        });
        Array.prototype.forEach.call(box.querySelectorAll("[data-delete]"), function (btn) {
          btn.addEventListener("click", function () {
            if (!window.confirm("Delete this record? This can't be undone.")) return;
            fetch(model.apiPath + "/" + encodeURIComponent(btn.getAttribute("data-delete")), {
              method: "DELETE",
              credentials: "include",
            }).then(function () { loadData(model, editableFields); });
          });
        });
      })
      .catch(function () {
        box.innerHTML = '<div class="empty">Couldn’t load data from ' + escapeHtml(model.apiPath) + ".</div>";
      });
  }

  function inputForField(field, value) {
    var v = value == null ? "" : value;
    if (field.isEnum) {
      var options = (field.enumValues || [])
        .map(function (opt) {
          return '<option value="' + escapeHtml(opt) + '"' + (v === opt ? " selected" : "") + ">" + escapeHtml(opt) + "</option>";
        })
        .join("");
      return '<select name="' + escapeHtml(field.name) + '">' + options + "</select>";
    }
    if (field.type === "Boolean") {
      return '<select name="' + escapeHtml(field.name) + '">' +
        '<option value="true"' + (v === true ? " selected" : "") + ">true</option>" +
        '<option value="false"' + (v === false ? " selected" : "") + ">false</option>" +
        "</select>";
    }
    var inputType = field.type === "Int" || field.type === "Float" || field.type === "BigInt" || field.type === "Decimal"
      ? "number"
      : field.type === "DateTime"
        ? "datetime-local"
        : "text";
    var displayValue = field.type === "DateTime" && v ? String(v).slice(0, 16) : v;
    return '<input type="' + inputType + '" name="' + escapeHtml(field.name) + '" value="' + escapeHtml(displayValue) + '" ' +
      (field.isId ? "readonly" : "") + " />";
  }

  function openRecordForm(model, editableFields, record) {
    var backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    var fieldsHtml = editableFields
      .filter(function (f) { return !f.isId; })
      .map(function (f) {
        return "<label>" + escapeHtml(f.name) + (f.isOptional ? "" : " *") + "</label>" +
          inputForField(f, record ? record[f.name] : null);
      })
      .join("");

    backdrop.innerHTML =
      '<div class="modal">' +
      "<h3>" + (record ? "Edit " : "Add ") + escapeHtml(model.name) + "</h3>" +
      '<form id="record-form">' + fieldsHtml + '<div class="error" id="record-error"></div>' +
      '<div class="modal-actions">' +
      '<button type="button" id="cancel-record">Cancel</button>' +
      '<button class="primary" type="submit">' + (record ? "Save" : "Create") + "</button>" +
      "</div></form></div>";

    document.body.appendChild(backdrop);
    backdrop.querySelector("#cancel-record").addEventListener("click", function () {
      document.body.removeChild(backdrop);
    });

    backdrop.querySelector("#record-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var form = new FormData(e.target);
      var body = {};
      editableFields.forEach(function (f) {
        if (!form.has(f.name)) return;
        var raw = form.get(f.name);
        if (raw === "" && f.isOptional) return;
        if (f.type === "Boolean") body[f.name] = raw === "true";
        else if (f.type === "Int" || f.type === "BigInt") body[f.name] = parseInt(raw, 10);
        else if (f.type === "Float" || f.type === "Decimal") body[f.name] = parseFloat(raw);
        else body[f.name] = raw;
      });

      var url = record ? model.apiPath + "/" + encodeURIComponent(record.id) : model.apiPath;
      fetch(url, {
        method: record ? "PUT" : "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      })
        .then(function (res) {
          return res.json().then(function (data) {
            if (!res.ok) throw new Error(data.error || "Save failed");
            return data;
          });
        })
        .then(function () {
          document.body.removeChild(backdrop);
          loadData(model, editableFields);
        })
        .catch(function (err) {
          backdrop.querySelector("#record-error").textContent = err.message;
        });
    });
  }

  // ---- Users panel ----

  function renderUsers(container) {
    container.innerHTML =
      '<div class="panel"><h3 style="margin-top:0">Invite someone</h3>' +
      '<form id="invite-user-form" style="display:flex;gap:8px;align-items:flex-end">' +
      '<div style="flex:1"><label>Email</label><input type="email" name="email" required /></div>' +
      '<button class="primary" type="submit">Invite</button>' +
      "</form>" +
      '<div id="invite-result" style="margin-top:10px"></div>' +
      "</div>" +
      '<div class="panel"><h3 style="margin-top:0">Dashboard users</h3><div id="users-list"><p class="hint">Loading…</p></div></div>';

    document.getElementById("invite-user-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var form = new FormData(e.target);
      api("/api/users/invite", { method: "POST", body: { email: form.get("email") } })
        .then(function (data) {
          var full = window.location.origin + data.inviteUrl;
          document.getElementById("invite-result").innerHTML =
            '<p class="success">Invite link — copy and share it:</p><input readonly value="' + escapeHtml(full) + '" />';
          loadUsers();
          e.target.reset();
        })
        .catch(function (err) {
          document.getElementById("invite-result").innerHTML = '<p class="error">' + escapeHtml(err.message) + "</p>";
        });
    });

    loadUsers();
  }

  function loadUsers() {
    var box = document.getElementById("users-list");
    api("/api/users").then(function (data) {
      box.innerHTML = data.items
        .map(function (u) {
          return (
            '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">' +
            "<div>" + escapeHtml(u.email) + '<span class="field-badge">' + u.role + "</span></div>" +
            (u.role !== "owner" ? '<button class="danger" data-remove="' + u.id + '">Remove</button>' : "") +
            "</div>"
          );
        })
        .join("");
      Array.prototype.forEach.call(box.querySelectorAll("[data-remove]"), function (btn) {
        btn.addEventListener("click", function () {
          api("/api/users/" + btn.getAttribute("data-remove"), { method: "DELETE" }).then(loadUsers);
        });
      });
    });
  }

  // ---- Boot ----

  function loadSchema() {
    return api("/api/schema").then(function (data) {
      state.models = data.models || [];
    });
  }

  api("/api/session")
    .then(function (data) {
      state.needsSetup = !!data.needsSetup;
      if (data.authenticated) {
        state.user = data.user;
        return loadSchema();
      }
    })
    .catch(function () {})
    .then(function () {
      state.loading = false;
      render();
    });
})();
</script>
</body>
</html>
