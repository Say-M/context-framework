# Production-mode stack: bundled Bun API + static web build served by nginx,
# fronted on a single public port. Env vars come from ./.env (copy
# .env.example to .env and fill in real values first).
#
#   docker compose up --build -d

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # Single-node replica set — required for multi-document transactions,
    # which don't exist on a standalone mongod. The healthcheck doubles as
    # one-time initiation: rs.initiate() only succeeds once, so subsequent
    # checks just fall through to the ping.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate() }; db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-5500}
      - WEB_ORIGIN=${WEB_ORIGIN}
      - GENERATOR_WEB_ORIGIN=${GENERATOR_WEB_ORIGIN}
      - STUDIO_WEB_ORIGIN=${STUDIO_WEB_ORIGIN}
      - GENERATED_APPS_DIR=/app/data/generated-apps
      - STUDIO_ASSETS_DIR=/app/data/studio-assets
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/bismo?replicaSet=rs0}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_INVITE_SECRET=${JWT_INVITE_SECRET}
      - PII_ENCRYPTION_KEY=${PII_ENCRYPTION_KEY}
      - EMAIL_HASH_SECRET=${EMAIL_HASH_SECRET}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
    volumes:
      - generated_apps_data:/app/data/generated-apps
      - studio_assets_data:/app/data/studio-assets
    expose:
      - "${PORT:-5500}"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
      args:
        # Empty on purpose: nginx serves the built app and proxies /api on
        # the same origin, so the browser calls relative paths.
        - VITE_API_URL=${VITE_API_URL:-}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      - API_HOST=api
      - API_PORT=${PORT:-5500}
      - WEB_INTERNAL_PORT=80
    ports:
      - "${WEB_PORT:-8080}:80"

  generator-web:
    build:
      context: .
      dockerfile: apps/generator-web/Dockerfile
      target: production
      args:
        - VITE_API_URL=${VITE_API_URL:-}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      - API_HOST=api
      - API_PORT=${PORT:-5500}
      - WEB_INTERNAL_PORT=80
    ports:
      - "${GENERATOR_WEB_PORT:-8081}:80"

  studio-web:
    build:
      context: .
      dockerfile: apps/studio-web/Dockerfile
      target: production
      args:
        - VITE_API_URL=${VITE_API_URL:-}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      - API_HOST=api
      - API_PORT=${PORT:-5500}
      - WEB_INTERNAL_PORT=80
    ports:
      - "${STUDIO_WEB_PORT:-8082}:80"

volumes:
  mongo_data:
  generated_apps_data:
  studio_assets_data:
